name: Build & Publish Android APK (GitHub Releases)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de version (ex. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compiler APK Android avec Gradle
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://ais-dev-ypt2be35uniibdgvlmkj3f-646904106584.us-west2.run.app' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 17 (requis par Android Gradle Plugin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Verify & Provision Android SDK 35 / Build-Tools / NDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "Erreur : sdkmanager introuvable sous $SDK_DIR" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          ls -la "$SDK_DIR/platforms" "$SDK_DIR/build-tools" "$SDK_DIR/ndk" "$SDK_DIR/cmake"

      - name: Install Mobile Dependencies
        working-directory: mobile-expo
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android (Generate native android/ project)
        working-directory: mobile-expo
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Enforce HTTPS-only Network Security Config on Android
        working-directory: mobile-expo
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("android:networkSecurityConfig")) {
              xml = xml.replace(/<application\b/, "<application android:networkSecurityConfig=\"@xml/network_security_config\"");
            }
            if (!xml.includes("android:usesCleartextTraffic")) {
              xml = xml.replace(/<application\b/, "<application android:usesCleartextTraffic=\"false\"");
            }
            fs.writeFileSync(p, xml);
          '

      - name: Harden Gradle Settings, Memory & Release Lint Config
        working-directory: mobile-expo
        run: |
          node -e '
            const fs = require("fs");

            // 1. ASCII Gradle project name (app display name remains V-Micro Crédit in strings.xml)
            const settingsPath = "android/settings.gradle";
            let settings = fs.readFileSync(settingsPath, "utf8");
            settings = settings.replace(/rootProject\.name\s*=\s*[\x27"][^\x27"]+[\x27"]/, "rootProject.name = \x27vmicro-credit\x27");
            fs.writeFileSync(settingsPath, settings);

            // 2. Tune JVM heap & metaspace for Kotlin + CMake + R8 without OOM
            const propsPath = "android/gradle.properties";
            let props = fs.readFileSync(propsPath, "utf8");
            if (/^org\.gradle\.jvmargs=.*/m.test(props)) {
              props = props.replace(/^org\.gradle\.jvmargs=.*/m, "org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8");
            } else {
              props += "\norg.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n";
            }
            if (!props.includes("kotlin.daemon.jvmargs=")) {
              props += "kotlin.daemon.jvmargs=-Xmx1536m\n";
            }
            if (!props.includes("android.prefabEnabled=")) {
              props += "android.prefabEnabled=true\n";
            }
            fs.writeFileSync(propsPath, props);

            // 3. Disable fatal lintVital halt on third-party RN/Expo dependencies in release builds
            const appGradlePath = "android/app/build.gradle";
            let appGradle = fs.readFileSync(appGradlePath, "utf8");
            if (!appGradle.includes("checkReleaseBuilds")) {
              appGradle = appGradle.replace(
                /android\s*\{/,
                "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }"
              );
              fs.writeFileSync(appGradlePath, appGradle);
            }
          '

      - name: Configure Release Keystore (if provided in GitHub Secrets)
        id: keystore
        working-directory: mobile-expo/android/app
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK via Gradle
        working-directory: mobile-expo/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease \
              --no-daemon --stacktrace --console=plain --max-workers=2 \
              -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            ./gradlew assembleRelease \
              --no-daemon --stacktrace --console=plain --max-workers=2 \
              -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          fi

      - name: Verify & Rename Output APK
        id: apk
        working-directory: mobile-expo
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            PRERELEASE="false"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            PRERELEASE="false"
          else
            TAG="latest"
            PRERELEASE="false"
          fi
          echo "Listing all generated APKs under android/app/build/outputs/apk:"
          find android/app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} + || true
          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Erreur : aucun APK valide généré dans android/app/build/outputs/apk" >&2
            exit 1
          fi
          OUT_APK="v-micro-credit-${TAG}.apk"
          cp "$APK_PATH" "$OUT_APK"
          ls -lh "$OUT_APK"
          sha256sum "$OUT_APK"
          echo "apk_file=mobile-expo/${OUT_APK}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v-micro-credit-apk-${{ steps.apk.outputs.tag }}
          path: ${{ steps.apk.outputs.apk_file }}

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "V-Micro Crédit Android (${{ steps.apk.outputs.tag }})"
          prerelease: ${{ steps.apk.outputs.prerelease == 'true' }}
          make_latest: true
          overwrite_files: true
          body: |
            Application Android **V-Micro Crédit** compilée automatiquement via GitHub Actions + Gradle.
            - HTTPS strict activé (`cleartextTrafficPermitted="false"`)
            - Stockage JWT chiffré (`Expo SecureStore`) & `BiometricPrompt` Android
            - Environnement de démonstration / simulation RDC
          files: ${{ steps.apk.outputs.apk_file }}
